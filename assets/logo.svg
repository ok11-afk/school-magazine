<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="49" fill="#ffffff"/>
  
  <g>
    <!-- Голова-круг -->
    <circle cx="50" cy="50" r="27" fill="none" stroke="#2d3748" stroke-width="3"/>
    
    <!-- 🟢 ЗЕЛЁНЫЙ — дуга A→B (верх → низ-право) -->
    <path d="M 50 23 A 27 27 0 0 1 73.4 63.5" 
          fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 🔵 СИНИЙ — дуга B→C (низ-право → низ-лево) -->
    <path d="M 73.4 63.5 A 27 27 0 0 1 26.6 63.5" 
          fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 🔴 КРАСНЫЙ — дуга C→A (низ-лево → верх) -->
    <path d="M 26.6 63.5 A 27 27 0 0 1 50 23" 
          fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Экран-очки -->
    <rect x="34" y="42" width="32" height="14" rx="6" fill="#2d3748"/>
